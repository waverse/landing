apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: waverse
  labels:
    app: landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
      - name: landing
        image: registry.ventic.tv/waverse/landing:1.0.1
        imagePullPolicy: Always
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: "0.5"
